name: Build APK

# Автосборка APK: на каждый push, на теги v*, по кнопке и на pull request.
# Артефакт всегда доступен во вкладке Actions; для main и тегов создаётся Release.

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Опубликовать GitHub Release с APK'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Собрать APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Версия сборки
        id: ver
        run: |
          set -euo pipefail
          NAME=$(grep -E '^versionName=' version.properties | cut -d= -f2)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Версия: $NAME (код ${{ github.run_number }})"

      - name: Иконки из design/ (ImageMagick, если есть)
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1; then
            echo "ImageMagick не установлен — беру иконки, закоммиченные в репозиторий"
            exit 0
          fi
          chmod +x scripts/gen_icons.sh
          ./scripts/gen_icons.sh

      - name: Ключ подписи
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # 1. Приватный ключ из секретов имеет приоритет
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS:-arena}"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "storeType=JKS"
            } > keystore.properties
            echo "source=секреты репозитория" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Использую ключ из секретов репозитория"
            exit 0
          fi

          # 2. Постоянный ключ в репозитории — им подписаны все опубликованные APK
          if [ -f keystore/keystore.properties ] && [ -f keystore/arena-release.p12 ]; then
            echo "source=постоянный ключ keystore/arena-release.p12" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Использую постоянный ключ из репозитория"
            exit 0
          fi

          # 3. Страховка: ключа нет вовсе — создаём постоянный и коммитим его,
          #    чтобы этот и все следующие APK были подписаны одинаково
          echo "Постоянный ключ не найден — создаю новый"
          mkdir -p keystore
          keytool -genkeypair -noprompt \
            -keystore keystore/arena-release.p12 \
            -storetype PKCS12 -alias arena \
            -keyalg RSA -keysize 3072 -validity 10950 \
            -storepass arena-mobile -keypass arena-mobile \
            -dname "CN=Arena Mobile, O=Arena Mobile, C=BY"
          {
            echo "storeFile=keystore/arena-release.p12"
            echo "storePassword=arena-mobile"
            echo "keyAlias=arena"
            echo "keyPassword=arena-mobile"
            echo "storeType=PKCS12"
          } > keystore/keystore.properties
          cat > keystore/README.md <<'EOT'
          # Постоянный ключ подписи

          `arena-release.p12` — постоянный ключ, которым подписываются debug- и release-APK.
          Он обязателен для установки обновлений поверх ранее установленного приложения.

          * алиас: `arena`, пароль хранилища и ключа: `arena-mobile`
          * посмотреть отпечаток: `apksigner verify --print-certs <apk>`
          EOT

          git config user.name "arena-ci"
          git config user.email "arena-ci@users.noreply.github.com"
          git add -f keystore/arena-release.p12 keystore/keystore.properties keystore/README.md
          if git diff --cached --quiet; then
            echo "Коммитить нечего"
          else
            git commit -m "chore: постоянный ключ подписи APK [skip ci]"
            if [[ "$GITHUB_REF" == refs/heads/* ]]; then
              git push origin "HEAD:${GITHUB_REF#refs/heads/}" \
                || echo "::warning::не удалось запушить ключ подписи — закоммитьте keystore/ вручную"
            else
              echo "::warning::ключ создан вне ветки — закоммитьте keystore/ вручную"
            fi
          fi
          echo "source=ключ, созданный в CI" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Статическая проверка проекта
        run: python3 tools/selfcheck.py

      - name: Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Юнит-тесты и сборка APK (debug + release)
        id: build
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            -PversionCode="${{ steps.ver.outputs.code }}" \
            -PversionName="${{ steps.ver.outputs.name }}" \
            --stacktrace --console=plain --no-daemon 2>&1 | tee gradle-build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Диагностика сборки
        if: steps.build.outputs.status != '0'
        run: |
          set +e
          echo "Gradle завершился с кодом: ${{ steps.build.outputs.status }}"
          grep -E "^(e: |.*error: |FAILURE: |What went wrong|Execution failed for task|Caused by: |> Task .*FAILED|Could not |There were failing tests|.*Test.*FAILED)" gradle-build.log \
            | head -45 | while IFS= read -r line; do
              echo "::error::$line"
            done
          {
            echo "## Ошибки сборки"
            echo '```'
            grep -nE "^(e: |.*error: |FAILURE: |What went wrong|Execution failed for task|Caused by: |> Task .*FAILED|Could not |There were failing tests|.*Test.*FAILED)" gradle-build.log | head -80
            echo '```'
            echo "### Хвост лога"
            echo '```'
            tail -30 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Собрать артефакты в dist/
        if: steps.build.outputs.status == '0'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # debug-APK — тоже подписан постоянным ключом, ставится поверх прошлых версий
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/ArenaMobile-${VERSION_NAME}-build${VERSION_CODE}-debug.apk"

          # release-APK подписан тем же ключом; если подписи нет, уходит только в артефакты
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/ArenaMobile-${VERSION_NAME}-build${VERSION_CODE}.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            mkdir -p dist/unsigned
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
               "dist/unsigned/ArenaMobile-${VERSION_NAME}-build${VERSION_CODE}-unsigned.apk"
          fi
        id: dist

      - name: Проверить APK (aapt2 + apksigner)
        if: steps.build.outputs.status == '0'
        run: |
          set +e
          DEBUG_APK=$(ls dist/*-debug.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          AAPT="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          [ -x "$AAPT" ] || AAPT=$(command -v aapt2 || true)

          {
            echo "## Проверка APK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            echo "== aapt2 dump badging ==" | tee -a "$GITHUB_STEP_SUMMARY"
            "$AAPT" dump badging "$DEBUG_APK" \
              | grep -E "^(package|sdkVersion|targetSdkVersion|launchable-activity|application-label|uses-permission)" \
              | head -20 | tee -a "$GITHUB_STEP_SUMMARY"

            echo "== профили в манифесте (android:process) ==" | tee -a "$GITHUB_STEP_SUMMARY"
            "$AAPT" dump xmltree --file AndroidManifest.xml "$DEBUG_APK" 2>/dev/null \
              | grep -A1 "android:process" | grep -oE '"[^"]*"' | sort -u | head -10 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "aapt2 не найден — пропускаю разбор манифеста" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if [ -x "$APKSIGNER" ]; then
            echo "== подпись ==" | tee -a "$GITHUB_STEP_SUMMARY"
            "$APKSIGNER" verify --print-certs "$DEBUG_APK" 2>&1 | head -5 | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Ключевые факты — в аннотации (видны без скачивания логов).
          # Локальные варианты подписи отфильтрованы, иначе аннотаций слишком много.
          "$AAPT" dump badging "$DEBUG_APK" 2>/dev/null \
            | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|launchable-activity)" \
            | while IFS= read -r line; do echo "::notice::$line"; done

          PROCESSES=$("$AAPT" dump xmltree --file AndroidManifest.xml "$DEBUG_APK" 2>/dev/null \
            | grep -A1 "android:process" | grep -oE '":p[0-9]"' | sort -u | tr -d '"' | tr '\n' ' ')
          echo "::notice::процессы профилей в манифесте: ${PROCESSES:-не найдены}"

          SIGN_RESULT=$("$APKSIGNER" verify --verbose "$DEBUG_APK" 2>&1 | grep -E "^(Verifies|Verified using)" | head -3 | tr '\n' '; ')
          echo "::notice::подпись debug-APK: ${SIGN_RESULT:-нет данных}"

          # Отпечаток сертификата: по нему видно, что все сборки подписаны одним ключом
          fingerprint() {
            "$APKSIGNER" verify --print-certs "$1" 2>/dev/null \
              | grep -m1 "SHA-256 digest" | sed 's/.*digest: *//' | tr 'A-F' 'a-f'
          }

          DEBUG_FP=$(fingerprint "$DEBUG_APK")
          echo "::notice::SHA-256 сертификата: ${DEBUG_FP:-неизвестно}"

          RELEASE_APK=$(ls dist/ArenaMobile-*-build*.apk 2>/dev/null | grep -v debug | head -1)
          if [ -n "$RELEASE_APK" ]; then
            RELEASE_FP=$(fingerprint "$RELEASE_APK")
            echo "::notice::release-APK подписан тем же ключом: $([ "$DEBUG_FP" = "$RELEASE_FP" ] && echo да || echo НЕТ)"
            if [ "$DEBUG_FP" != "$RELEASE_FP" ]; then
              echo "::error::debug и release подписаны разными ключами — обновления не встанут поверх"
              exit 1
            fi
          fi

          # Стабильность подписи между запусками CI: сравниваем с отпечатком,
          # который зафиксирован в репозитории
          EXPECTED_FP=$(grep -oE 'F7:11:DD:93[0-9A-F:]*' keystore/README.md 2>/dev/null | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          if [ -n "$EXPECTED_FP" ] && [ -n "$DEBUG_FP" ] && [ "$EXPECTED_FP" != "$DEBUG_FP" ]; then
            echo "::warning::отпечаток ключа (${DEBUG_FP}) отличается от ожидаемого (${EXPECTED_FP}) — проверьте keystore/arena-release.p12"
          fi

          # Проверяем, что R8 не переименовал кастомный View и методы JS-моста
          python3 tools/check_apk.py dist

      - name: Итоги сборки
        if: steps.build.outputs.status == '0'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          {
            echo "### APK готов"
            echo ""
            echo "| файл | размер | sha256 |"
            echo "|---|---|---|"
            for f in dist/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist dist/* 2>/dev/null | head -20

      - name: Загрузить APK как артефакт
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v6
        with:
          name: ArenaMobile-APK-${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          path: dist/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Опубликовать Release
        if: >-
          steps.build.outputs.status == '0' && github.event_name != 'pull_request' && (
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref == 'refs/heads/main' ||
          github.event.inputs.publish_release == 'true' )
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-b{1}', steps.ver.outputs.name, github.run_number) }}
          name: Arena Mobile ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          body: |
            Автоматически собранный APK приложения **Arena Mobile**.

            * версия: `${{ steps.ver.outputs.name }}`
            * номер сборки (versionCode): `${{ github.run_number }}`
            * ветка/коммит: `${{ github.ref_name }}` / `${{ github.sha }}`
            * подпись: постоянный ключ (`keystore/arena-release.p12`, источник: ${{ steps.signing.outputs.source }}) — оба APK
              подписаны одинаково, поэтому обновления ставятся поверх без переустановки

            | файл | что это |
            |---|---|
            | `ArenaMobile-${{ steps.ver.outputs.name }}-build${{ github.run_number }}.apk` | release-сборка, сжата R8 — рекомендуемый вариант |
            | `ArenaMobile-${{ steps.ver.outputs.name }}-build${{ github.run_number }}-debug.apk` | debug-сборка |

            **Как установить:** скачайте APK, откройте файл на телефоне и разрешите установку
            из этого источника. Новые версии ставятся поверх старых — профили аккаунтов,
            сессии Arena и подключения GitHub сохраняются.
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
