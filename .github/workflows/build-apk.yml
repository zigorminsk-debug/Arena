name: Build APK

# Автосборка APK: на каждый push, на теги v*, по кнопке и на pull request.
# Артефакт всегда доступен во вкладке Actions; для main и тегов создаётся Release.

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Опубликовать GitHub Release с APK'
        type: boolean
        default: false
      rotate_key:
        description: 'СОЗДАТЬ НОВЫЙ ключ подписи (обновления перестанут ставиться поверх!)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Собрать APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Версия сборки
        id: ver
        run: |
          set -euo pipefail
          NAME=$(grep -E '^versionName=' version.properties | cut -d= -f2)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Версия: $NAME (код ${{ github.run_number }})"

      - name: Иконки из design/ (ImageMagick, если есть)
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1; then
            echo "ImageMagick не установлен — беру иконки, закоммиченные в репозиторий"
            exit 0
          fi
          chmod +x scripts/gen_icons.sh
          ./scripts/gen_icons.sh

      - name: Ключ подписи
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ROTATE_KEY: ${{ github.event.inputs.rotate_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ------------------------------------------------------------------
          # ПОСТОЯННЫЙ КЛЮЧ ПОДПИСИ.
          #
          # Отпечаток и метка зафиксированы здесь и не меняются: смена ключа
          # означает одноразовую переустановку приложения у всех, обновления
          # «поверх» перестают ставиться. Поэтому новый ключ НЕ создаётся
          # молча — сборка останавливается с ошибкой.
          #
          # Ключ ищется по порядку:
          #   1) секреты репозитория KEYSTORE_BASE64/KEYSTORE_PASSWORD/...;
          #   2) keystore/ в текущей ветке (keystore/arena-release.p12);
          #   3) метка signing-key-v1 — она указывает на коммит с ключом
          #      и живёт независимо от ветвей, поэтому доступна новому агенту
          #      и любой другой копии репозитория;
          #   4) релиз с ключом (ассеты signing-key-v1);
          #   5) только при явном перезапуске с rotate_key=true — новый ключ.
          # ------------------------------------------------------------------
          EXPECTED_FINGERPRINT="f711dd937bd6a8c7a43a8d9cc34f54e702e94da64b7f175cd1c575cd114ba4aa"
          KEYSTORE_TAG="signing-key-v1"
          KEYSTORE_PATH=""
          STORE_PASSWORD=""
          KEY_ALIAS_VALUE="arena"

          normalize_fp() { tr -d ':' | tr 'A-F' 'a-f' | tr -d ' '; }

          detect_store_type() {   # $1 — файл, $2 — пароль
            if keytool -list -keystore "$1" -storepass "$2" -storetype PKCS12 >/dev/null 2>&1; then
              echo "PKCS12"
            else
              echo "JKS"
            fi
          }

          check_key() {   # $1 — файл, $2 — пароль, $3 — алиас
            local fp
            fp=$(keytool -list -v -keystore "$1" -storepass "$2" -alias "$3" 2>/dev/null \
              | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | normalize_fp || true)
            if [ -z "${fp:-}" ]; then
              echo "::error::не удалось прочитать сертификат из $1 (пароль или алиас не подходят)"
              return 1
            fi
            if [ "$fp" != "$EXPECTED_FINGERPRINT" ]; then
              echo "::error::ключ в $1 не совпадает с постоянным ключом подписи. Ожидается $EXPECTED_FINGERPRINT, получено $fp. С этим ключом обновления НЕ встанут поверх установленного приложения. Восстановите постоянный ключ из метки ${KEYSTORE_TAG} (git show ${KEYSTORE_TAG}:keystore/arena-release.p12) или из релиза с тем же тегом."
              return 1
            fi
            echo "Ключ подписи: $1 (отпечаток $fp) — совпадает с постоянным"
          }

          # 1. Ключ из секретов репозитория — приоритетный источник
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            STORE_TYPE=$(detect_store_type release.jks "$KEYSTORE_PASSWORD")
            KEY_ALIAS_VALUE="${KEY_ALIAS:-arena}"
            {
              echo "storeFile=release.jks"
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS_VALUE}"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "storeType=${STORE_TYPE}"
            } > keystore.properties
            if ! check_key release.jks "$KEYSTORE_PASSWORD" "$KEY_ALIAS_VALUE"; then
              exit 1
            fi
            echo "source=секреты репозитория" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::подпись: ключ из секретов репозитория"
            exit 0
          fi

          # 2. Постоянный ключ в ветке — им подписаны все опубликованные APK
          if [ -f keystore/keystore.properties ] && [ -f keystore/arena-release.p12 ]; then
            KEYSTORE_PATH="keystore/arena-release.p12"
            STORE_PASSWORD=$(grep -E '^storePassword=' keystore/keystore.properties | cut -d= -f2-)
            KEY_ALIAS_VALUE=$(grep -E '^keyAlias=' keystore/keystore.properties | cut -d= -f2-)
          else
            # 3. Восстанавливаем из метки: она указывает на коммит с ключом
            mkdir -p keystore
            if git fetch --depth=1 origin "+refs/tags/${KEYSTORE_TAG}:refs/tags/${KEYSTORE_TAG}" >/dev/null 2>&1 \
              && git show "${KEYSTORE_TAG}:keystore/arena-release.p12" > keystore/arena-release.p12 2>/dev/null; then
              echo "Проверяю ключ из метки ${KEYSTORE_TAG}"
              git show "${KEYSTORE_TAG}:keystore/keystore.properties" > keystore/keystore.properties 2>/dev/null || true
              echo "::notice::ключ подписи восстановлен из метки ${KEYSTORE_TAG}"
            else
              rm -f keystore/arena-release.p12
              # 4. Запасной путь: ассеты релиза с тем же тегом
              if command -v gh >/dev/null 2>&1 \
                && gh release download "${KEYSTORE_TAG}" -R "${GITHUB_REPOSITORY}" -p "arena-release.p12" -D keystore --clobber >/dev/null 2>&1; then
                gh release download "${KEYSTORE_TAG}" -R "${GITHUB_REPOSITORY}" -p "keystore.properties" -D keystore --clobber >/dev/null 2>&1 || true
                echo "::notice::ключ подписи восстановлен из релиза ${KEYSTORE_TAG}"
              fi
            fi

            if [ ! -f keystore/keystore.properties ] && [ -f keystore/arena-release.p12 ]; then
              {
                echo "storeFile=keystore/arena-release.p12"
                echo "storePassword=arena-mobile"
                echo "keyAlias=arena"
                echo "keyPassword=arena-mobile"
                echo "storeType=PKCS12"
              } > keystore/keystore.properties
            fi

            if [ -f keystore/arena-release.p12 ]; then
              KEYSTORE_PATH="keystore/arena-release.p12"
              STORE_PASSWORD=$(grep -E '^storePassword=' keystore/keystore.properties | cut -d= -f2-)
              KEY_ALIAS_VALUE=$(grep -E '^keyAlias=' keystore/keystore.properties | cut -d= -f2-)
            fi
          fi

          if [ -n "$KEYSTORE_PATH" ]; then
            if ! check_key "$KEYSTORE_PATH" "$STORE_PASSWORD" "$KEY_ALIAS_VALUE"; then
              exit 1
            fi
            echo "source=постоянный ключ keystore/arena-release.p12" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::подпись: постоянный ключ из репозитория"
            exit 0
          fi

          # 5. Ключа нет нигде. Без явного разрешения новый не создаём:
          #    с новым ключом обновления не встанут поверх установленного APK.
          if [ "${ROTATE_KEY:-}" != "true" ]; then
            echo "::error::постоянный ключ подписи не найден (нет ни в секретах, ни в ветке, ни в метке ${KEYSTORE_TAG}). Сборка остановлена, чтобы НЕ создать другой ключ: с ним обновления перестанут устанавливаться поверх. Восстановите ключ: git fetch origin tag ${KEYSTORE_TAG} && git show ${KEYSTORE_TAG}:keystore/arena-release.p12 > keystore/arena-release.p12 (или скачайте ассет из релиза ${KEYSTORE_TAG}). Если ключ нужно сменить осознанно — перезапустите workflow с включённым rotate_key."
            exit 1
          fi

          echo "::warning::запрошена ротация ключа (rotate_key) — создаю НОВЫЙ ключ подписи. Обновления поверх текущих сборок перестанут ставиться, потребуется переустановка приложения."
          mkdir -p keystore
          keytool -genkeypair -noprompt \
            -keystore keystore/arena-release.p12 \
            -storetype PKCS12 -alias arena \
            -keyalg RSA -keysize 3072 -validity 10950 \
            -storepass arena-mobile -keypass arena-mobile \
            -dname "CN=Arena Mobile, O=Arena Mobile, C=BY"
          {
            echo "storeFile=keystore/arena-release.p12"
            echo "storePassword=arena-mobile"
            echo "keyAlias=arena"
            echo "keyPassword=arena-mobile"
            echo "storeType=PKCS12"
          } > keystore/keystore.properties

          git config user.name "arena-ci"
          git config user.email "arena-ci@users.noreply.github.com"
          git add -f keystore/arena-release.p12 keystore/keystore.properties
          if git diff --cached --quiet; then
            echo "Коммитить нечего"
          else
            git commit -m "chore: новый ключ подписи APK (осознанная ротация) [skip ci]"
            if [[ "$GITHUB_REF" == refs/heads/* ]]; then
              git push origin "HEAD:${GITHUB_REF#refs/heads/}" \
                || echo "::warning::не удалось запушить ключ подписи — закоммитьте keystore/ вручную"
            else
              echo "::warning::ключ создан вне ветки — закоммитьте keystore/ вручную"
            fi
          fi
          echo "source=новый ключ, созданный в CI по запросу" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Резервная копия ключа подписи
        if: steps.signing.outputs.signed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KEYSTORE_TAG="signing-key-v1"
          KEY_URL="repos/${GITHUB_REPOSITORY}/releases/tags/${KEYSTORE_TAG}"

          # Ключ, которым подписана эта сборка
          KEY_FILE=""
          for candidate in keystore/arena-release.p12 release.jks; do
            if [ -f "$candidate" ]; then
              KEY_FILE="$candidate"
              break
            fi
          done
          if [ -z "$KEY_FILE" ]; then
            echo "::warning::файл ключа для резервной копии не найден"
            exit 0
          fi

          mkdir -p /tmp/keystore-backup
          cp "$KEY_FILE" /tmp/keystore-backup/arena-release.p12
          if [ -f keystore/keystore.properties ]; then
            cp keystore/keystore.properties /tmp/keystore-backup/keystore.properties
          else
            {
              echo "storeFile=keystore/arena-release.p12"
              echo "storePassword=arena-mobile"
              echo "keyAlias=arena"
              echo "keyPassword=arena-mobile"
              echo "storeType=PKCS12"
            } > /tmp/keystore-backup/keystore.properties
          fi

          NOTES_FILE="keystore/KEY-RESTORE.md"
          if ! gh api "$KEY_URL" >/dev/null 2>&1; then
            echo "::notice::релиз ${KEYSTORE_TAG} отсутствует — создаю хранилище ключа"
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$KEYSTORE_TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "Ключ подписи Arena Mobile — НЕ УДАЛЯТЬ" --notes-file "$NOTES_FILE" \
                || echo "::warning::не удалось создать релиз ${KEYSTORE_TAG}"
            else
              gh release create "$KEYSTORE_TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "Ключ подписи Arena Mobile — НЕ УДАЛЯТЬ" \
                --notes "Резервная копия постоянного ключа подписи APK." \
                || echo "::warning::не удалось создать релиз ${KEYSTORE_TAG}"
            fi
          fi

          LOCAL_SHA=$(sha256sum /tmp/keystore-backup/arena-release.p12 | cut -d' ' -f1)
          REMOTE_SHA=$(gh api "$KEY_URL" --jq '.assets[] | select(.name=="arena-release.p12") | .digest // ""' 2>/dev/null \
            | sed 's/^sha256://' || true)

          if [ -n "$LOCAL_SHA" ] && [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
            echo "Резервная копия ключа в релизе ${KEYSTORE_TAG} актуальна (${LOCAL_SHA:0:12}…)"
          else
            if gh release upload "$KEYSTORE_TAG" \
              /tmp/keystore-backup/arena-release.p12 \
              /tmp/keystore-backup/keystore.properties --clobber >/dev/null 2>&1; then
              echo "::notice::резервная копия ключа подписи обновлена в релизе ${KEYSTORE_TAG}"
            else
              echo "::warning::не удалось обновить резервную копию ключа в релизе ${KEYSTORE_TAG}"
            fi
          fi

      - name: Статическая проверка проекта
        run: python3 tools/selfcheck.py

      - name: Gradle wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Юнит-тесты и сборка APK (debug + release)
        id: build
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease \
            -PversionCode="${{ steps.ver.outputs.code }}" \
            -PversionName="${{ steps.ver.outputs.name }}" \
            -Prepo="${GITHUB_REPOSITORY}" \
            --stacktrace --console=plain --no-daemon 2>&1 | tee gradle-build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Диагностика сборки
        if: steps.build.outputs.status != '0'
        run: |
          set +e
          echo "Gradle завершился с кодом: ${{ steps.build.outputs.status }}"
          grep -E "^(e: |.*error: |FAILURE: |What went wrong|Execution failed for task|Caused by: |> Task .*FAILED|Could not |There were failing tests|.*Test.*FAILED)" gradle-build.log \
            | head -45 | while IFS= read -r line; do
              echo "::error::$line"
            done
          {
            echo "## Ошибки сборки"
            echo '```'
            grep -nE "^(e: |.*error: |FAILURE: |What went wrong|Execution failed for task|Caused by: |> Task .*FAILED|Could not |There were failing tests|.*Test.*FAILED)" gradle-build.log | head -80
            echo '```'
            echo "### Хвост лога"
            echo '```'
            tail -30 gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Итоги юнит-тестов
        if: steps.build.outputs.status == '0'
        run: python3 tools/test_report.py

      - name: Собрать артефакты в dist/
        if: steps.build.outputs.status == '0'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # debug-APK — тоже подписан постоянным ключом, ставится поверх прошлых версий
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/ArenaMobile-${VERSION_NAME}-build${VERSION_CODE}-debug.apk"

          # release-APK подписан тем же ключом; если подписи нет, уходит только в артефакты
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               "dist/ArenaMobile-${VERSION_NAME}-build${VERSION_CODE}.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            mkdir -p dist/unsigned
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
               "dist/unsigned/ArenaMobile-${VERSION_NAME}-build${VERSION_CODE}-unsigned.apk"
          fi
        id: dist

      - name: Проверить APK (aapt2 + apksigner)
        if: steps.build.outputs.status == '0'
        run: |
          set +e
          DEBUG_APK=$(ls dist/*-debug.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          AAPT="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          [ -x "$AAPT" ] || AAPT=$(command -v aapt2 || true)

          {
            echo "## Проверка APK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            echo "== aapt2 dump badging ==" | tee -a "$GITHUB_STEP_SUMMARY"
            "$AAPT" dump badging "$DEBUG_APK" \
              | grep -E "^(package|sdkVersion|targetSdkVersion|launchable-activity|application-label|uses-permission)" \
              | head -20 | tee -a "$GITHUB_STEP_SUMMARY"

            echo "== профили в манифесте (android:process) ==" | tee -a "$GITHUB_STEP_SUMMARY"
            "$AAPT" dump xmltree --file AndroidManifest.xml "$DEBUG_APK" 2>/dev/null \
              | grep -A1 "android:process" | grep -oE '"[^"]*"' | sort -u | head -10 | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "aapt2 не найден — пропускаю разбор манифеста" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if [ -x "$APKSIGNER" ]; then
            echo "== подпись ==" | tee -a "$GITHUB_STEP_SUMMARY"
            "$APKSIGNER" verify --print-certs "$DEBUG_APK" 2>&1 | head -5 | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Ключевые факты — в аннотации (видны без скачивания логов).
          # Локальные варианты подписи отфильтрованы, иначе аннотаций слишком много.
          "$AAPT" dump badging "$DEBUG_APK" 2>/dev/null \
            | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|launchable-activity)" \
            | while IFS= read -r line; do echo "::notice::$line"; done

          PROCESSES=$("$AAPT" dump xmltree --file AndroidManifest.xml "$DEBUG_APK" 2>/dev/null \
            | grep -A1 "android:process" | grep -oE '":p[0-9]"' | sort -u | tr -d '"' | tr '\n' ' ')
          echo "::notice::процессы профилей в манифесте: ${PROCESSES:-не найдены}"

          SIGN_RESULT=$("$APKSIGNER" verify --verbose "$DEBUG_APK" 2>&1 | grep -E "^(Verifies|Verified using)" | head -3 | tr '\n' '; ')
          echo "::notice::подпись debug-APK: ${SIGN_RESULT:-нет данных}"

          # Отпечаток сертификата: по нему видно, что все сборки подписаны одним ключом
          fingerprint() {
            "$APKSIGNER" verify --print-certs "$1" 2>/dev/null \
              | grep -m1 "SHA-256 digest" | sed 's/.*digest: *//' | tr 'A-F' 'a-f'
          }

          DEBUG_FP=$(fingerprint "$DEBUG_APK")
          echo "::notice::SHA-256 сертификата: ${DEBUG_FP:-неизвестно}"

          RELEASE_APK=$(ls dist/ArenaMobile-*-build*.apk 2>/dev/null | grep -v debug | head -1)
          if [ -n "$RELEASE_APK" ]; then
            RELEASE_FP=$(fingerprint "$RELEASE_APK")
            echo "::notice::release-APK подписан тем же ключом: $([ "$DEBUG_FP" = "$RELEASE_FP" ] && echo да || echo НЕТ)"
            if [ "$DEBUG_FP" != "$RELEASE_FP" ]; then
              echo "::error::debug и release подписаны разными ключами — обновления не встанут поверх"
              exit 1
            fi
          fi

          # Стабильность подписи между запусками CI: сравниваем с отпечатком,
          # который зафиксирован в репозитории
          EXPECTED_FP=$(grep -oE 'F7:11:DD:93[0-9A-F:]*' keystore/README.md 2>/dev/null | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          if [ -n "$EXPECTED_FP" ] && [ -n "$DEBUG_FP" ] && [ "$EXPECTED_FP" != "$DEBUG_FP" ]; then
            echo "::error::отпечаток ключа (${DEBUG_FP}) отличается от постоянного (${EXPECTED_FP}): APK подписан не тем ключом, обновления не встанут поверх. Восстановите ключ из метки signing-key-v1."
            exit 1
          fi

          # Проверяем, что R8 не переименовал кастомный View и методы JS-моста
          python3 tools/check_apk.py dist

          # Манифест собранного APK: набор флагов configChanges читается через aapt2,
          # потому что внутри APK это битовая маска, а не строки
          if [ -n "$AAPT" ] && [ -x "$AAPT" ]; then
            "$AAPT" dump xmltree --file AndroidManifest.xml "$DEBUG_APK" > /tmp/manifest-tree.txt 2>/dev/null || true
            if [ -s /tmp/manifest-tree.txt ]; then
              python3 tools/check_manifest.py /tmp/manifest-tree.txt
            else
              echo "::warning::не удалось разобрать манифест собранного APK — проверка configChanges пропущена"
            fi
          fi

      - name: Итоги сборки
        if: steps.build.outputs.status == '0'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          {
            echo "### APK готов"
            echo ""
            echo "| файл | размер | sha256 |"
            echo "|---|---|---|"
            for f in dist/*.apk; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist dist/* 2>/dev/null | head -20

      - name: Загрузить APK как артефакт
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v6
        with:
          name: ArenaMobile-APK-${{ steps.ver.outputs.name }}-build${{ github.run_number }}
          path: dist/**/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Опубликовать Release
        if: >-
          steps.build.outputs.status == '0' && github.event_name != 'pull_request' && (
          startsWith(github.ref, 'refs/tags/v') ||
          github.ref == 'refs/heads/main' ||
          github.event.inputs.publish_release == 'true' )
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-b{1}', steps.ver.outputs.name, github.run_number) }}
          name: Arena Mobile ${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          body: |
            Автоматически собранный APK приложения **Arena Mobile**.

            * версия: `${{ steps.ver.outputs.name }}`
            * номер сборки (versionCode): `${{ github.run_number }}`
            * ветка/коммит: `${{ github.ref_name }}` / `${{ github.sha }}`
            * подпись: постоянный ключ (`keystore/arena-release.p12`, источник: ${{ steps.signing.outputs.source }}) — оба APK
              подписаны одинаково, поэтому обновления ставятся поверх без переустановки

            | файл | что это |
            |---|---|
            | `ArenaMobile-${{ steps.ver.outputs.name }}-build${{ github.run_number }}.apk` | release-сборка, сжата R8 — рекомендуемый вариант |
            | `ArenaMobile-${{ steps.ver.outputs.name }}-build${{ github.run_number }}-debug.apk` | debug-сборка |

            **Как установить:** скачайте APK, откройте файл на телефоне и разрешите установку
            из этого источника. Новые версии ставятся поверх старых — профили аккаунтов,
            сессии Arena и подключения GitHub сохраняются.
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
