# Параметры подписи APK.
#
# storeFile указывается относительно корня репозитория.
# Ключ постоянный: им подписываются и debug, и release сборки, поэтому новые
# версии APK устанавливаются ПОВЕРХ ранее установленных без удаления приложения.
#
# Если в GitHub заданы секреты KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS /
# KEY_PASSWORD, они имеют приоритет — этот файл тогда не используется.
storeFile=keystore/arena-release.p12
storePassword=arena-mobile
keyAlias=arena
keyPassword=arena-mobile
storeType=PKCS12
